[package]
name = "verso-io"
description = "Verso video outputs to other applications (NDI) and Resolume Advanced Output presets"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
libloading = "0.9.0"
thiserror.workspace = true
roxmltree = "0.20"
verso-core.workspace = true
usvg = { version = "0.45", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSGeometry", "objc2-core-foundation"] }
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "MTLDevice", "MTLTexture", "MTLCommandQueue", "MTLCommandBuffer", "MTLTypes", "MTLPixelFormat", "MTLResource", "MTLAllocation"] }
