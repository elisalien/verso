name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev \
            libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libgl1-mesa-dev libssl-dev libxcb1-dev libxcb-randr0-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Tests without GPU
        run: >
          cargo test --workspace
          --exclude verso-render
          --exclude verso-app
      # verso-app tests create a wgpu device; they run only where a GPU
      # (or a software adapter) exists. verso-render tests need the same.
      - name: GPU tests (best effort)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: cargo test -p verso-render -p verso-app
