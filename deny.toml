# cargo-deny: known vulnerabilities, licenses compatible with GPL-3.0,
# crates only from crates.io.

[advisories]
version = 2
yanked = "warn"
# Unmaintained crates are reported for our direct dependencies only: the
# ones deep in the tree (D-Bus crates under the file dialog) are not ours
# to replace.
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "LicenseRef-UFL-1.0",
    "CDLA-Permissive-2.0",
    "0BSD",
    "NCSA",
    "bzip2-1.0.6",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
